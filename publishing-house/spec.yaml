project:
  slug: "zt-security-pqc-tls"
  owner_email: "jloscar@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "new"
  automation_type: "ansible"
  description: "Join this hands-on workshop on RHEL 10 to learn how to defend against \"Harvest Now, Decrypt Later\" attacks. You'll set up a live web server, enable hybrid ML-KEM Post-Quantum Cryptography (PQC), break the network on purpose to test MTU limits and legacy client fallback, and apply the engineering fixes needed for production resilience."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1637"
  workflow_id: "75530c34-f356-4dec-ad44-c86dde0dde43"

spec:
  title: "Post-Quantum TLS on RHEL 10: Deploy, Break, and Fix a Quantum-Safe Web Server"
  learning_objectives:
  - "Deploy an Nginx web server with classical TLS 1.3 (ECDSA P-256) on RHEL 10"
  - "Configure hybrid ML-KEM-768 + X25519 post-quantum key exchange in Nginx"
  - "Troubleshoot PQC-induced network failures — MTU fragmentation and legacy-client handshake errors"
  - "Implement a hybrid fallback configuration that preserves backward compatibility"
  modules:                 # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
  - id: module-01
    title: "Fundamentals & the PQC Threat Model"
    duration_min: 5
    status: not_started
  - id: module-02
    title: "Deploy a Classical TLS Web Server"
    duration_min: 8
    status: not_started
  - id: module-03
    title: "Upgrade to Post-Quantum TLS"
    duration_min: 10
    status: not_started
  - id: module-04
    title: "Troubleshoot PQC Breaking Points & Fallback"
    duration_min: 12
    status: not_started
  environment:
    platform: "rhel-vms"       # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | azure | aro | rosa | google | gcp — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

